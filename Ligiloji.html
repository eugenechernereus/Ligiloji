/* =========================================================
   Ligiloji — SOFT SILVER / GRAPHITE THEME

<script>

const state = {
    data: {
        sections: [],
        categories: [],
        links: []
    },

    ui: {
        search: "",
        editId: null,
        activeCategoryId: null,
        selectedCategoryId: null,
        selectedType: null,
        selectedId: null,
        form: null,
        passwordTarget:null,
        sessionPassword: null
    }
};


/* =========================================================
   THEME SWITCHER
   ========================================================= */

function applyTheme(theme) {

    document.body.dataset.theme = theme;

    const button =
        document.querySelector(
            '[data-action="theme"]'
        );

    if(button){
        button.textContent =
            theme === "warm"
                ? "Gold"
                : "Silver";
    }
}


function toggleTheme(){

    const current =
        document.body.dataset.theme || "silver";

    const next =
        current === "silver"
            ? "warm"
            : "silver";

    applyTheme(next);
}


const fileTheme =
    document.body.dataset.theme || "silver";

applyTheme(fileTheme);


const sortByName = (a, b) => {

    if(a.system === "trash")
        return 1;
    if(b.system === "trash")
        return -1;
        
    return a.name.localeCompare(b.name);
};


const sortByTitle = (a, b) => a.title.localeCompare(b.title);


document.getElementById("title").textContent = document.title;


function updateTitle(){

    const title =
        document.getElementById("title");

    title.classList.toggle(
        "unsaved",
        state.ui.dirty
    );
}


function markChanged(){
    state.ui.dirty = true;
    updateTitle();

    const button =
        document.querySelector(
            '[data-action="save-temp"]'
        );

    if(button)
        button.textContent = "📸 TEMP SAVE";
}

function markSaved(){
    state.ui.dirty = false;
    updateTitle();
}


/* =========================================================
   TEMPORARY BACKUP
   ========================================================= */

const TEMP_SAVE_KEY =
    "ligiloji_temp_v1_" +
    encodeURIComponent(location.pathname);

async function saveTempData(){

    try {

        let tempData;

        /*
         * Если база открыта паролем,
         * временная копия тоже шифруется.
         */
        if(state.ui.sessionPassword){

            tempData =
                await encryptData(
                    state.data,
                    state.ui.sessionPassword
                );

        } else {

            tempData = state.data;
        }

        localStorage.setItem(
            TEMP_SAVE_KEY,
            JSON.stringify({
                version: 1,
                timestamp: Date.now(),
                encrypted: !!state.ui.sessionPassword,
                data: tempData
            })
        );
        
        const button =
            document.querySelector(
                '[data-action="save-temp"]'
            );

        if(button)
            button.textContent = "📸 Temp save";
    }

    catch(e){

        console.warn(
            "Ligiloji temporary save failed:",
            e
        );
    }
}


function getTempData(){

    try {

        const raw =
            localStorage.getItem(
                TEMP_SAVE_KEY
            );

        if(!raw)
            return null;

        const temp =
            JSON.parse(raw);

        if(
            !temp ||
            temp.version !== 1 ||
            !temp.data
        ){
            return null;
        }

        return temp;
    }
    
    catch(e){

        console.warn(
            "Ligiloji temporary backup is damaged:",
            e
        );

        localStorage.removeItem(
            TEMP_SAVE_KEY
        );

        return null;
    }
}


function clearTempData(){

    localStorage.removeItem(
        TEMP_SAVE_KEY
    );
}


async function restoreTempData(){

    const temp =
        getTempData();

    if(!temp)
        return false;

    let restoredData;

    try {

        if(temp.encrypted){

            if(!state.ui.sessionPassword)
                return false;

            restoredData =
                await decryptData(
                    temp.data,
                    state.ui.sessionPassword
                );

        } else {

            restoredData =
                temp.data;
        }

        if(
            !Array.isArray(restoredData.sections) ||
            !Array.isArray(restoredData.categories) ||
            !Array.isArray(restoredData.links)
        ){
            throw new Error(
                "Invalid temporary database"
            );
        }
    }
    
    catch(e){

        console.warn(
            "Ligiloji temporary backup cannot be restored:",
            e
        );

        return false;
    }

    const date =
        new Date(
            temp.timestamp
        ).toLocaleString();

    const restore =
        confirm(
            "Found temporary unsaved changes.\n\n" +
            "Saved: " + date +
            "\n\n" +
            "Restore them?"
        );

    if(!restore){

        clearTempData();

        return false;
    }

    state.data.sections =
        restoredData.sections;

    state.data.categories =
        restoredData.categories;

    state.data.links =
        restoredData.links;

    state.ui.dirty = true;

    if(state.data.categories.length){

        state.ui.selectedCategoryId =
            state.data.categories[0].id;
    }

    updateTitle();

    return true;
}


// загрузка данных
async function loadDatabase() {

    let db = JSON.parse(
        document
            .getElementById("database")
            .textContent
    );

    if(db.encrypted){

        state.ui.passwordTarget = db;

        state.ui.form = {
            type:"password"
        };

        return;
    }

    if(
        !Array.isArray(db.sections) ||
        !Array.isArray(db.categories) ||
        !Array.isArray(db.links)
    ){
        alert("Difektita bazo");
        return;
    }

    state.data.sections = db.sections;
    state.data.categories = db.categories;
    state.data.links = db.links;

    if(state.data.categories.length){

        state.ui.selectedCategoryId =
            state.data.categories[0].id;
    }

    await restoreTempData();
}


document
    .getElementById("json-file")
    .addEventListener("change", importJSON);

}


function focusFirstInput(){

function importJSON(e) {

    const file = e.target.files[0];

    if (!file)
        return;
        
    if (!confirm("Replace ALL date?")) {
        e.target.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {

        try {

            const data = JSON.parse(reader.result);
            
            if (
                !Array.isArray(data.sections) ||
                !Array.isArray(data.categories) ||
                !Array.isArray(data.links)
            ) {
                throw new Error();
            }

            state.data.sections = data.sections;
            state.data.categories = data.categories;
            state.data.links = data.links;
            
            markChanged();

            state.ui.selectedType = null;
            state.ui.selectedId = null;
            state.ui.selectedCategoryId = null;
            state.ui.activeCategoryId = null;
            state.ui.editId = null;

            render();

        } catch {

            alert("Wrong JSON");
        }
        
        e.target.value = "";
    };

    reader.readAsText(file);
}

function escapeHtml(text){
    const div = document.createElement("div");
    div.textContent = String(text ?? "");
    return div.innerHTML;
}


function renderMarkdown(text){

    if(!text)
        return "";

    let lines =
        String(text)
            .replace(/\r\n/g, "\n")
            .split("\n");

    let html = "";
    let inUl = false;
    let inOl = false;
    let inCodeBlock = false;
    let codeBuffer = [];
    let paragraph = [];


    function closeLists(){

        if(inUl){
            html += "</ul>";
            inUl = false;
        }

        if(inOl){
            html += "</ol>";
            inOl = false;
        }
    }


    function flushParagraph(){

        if(paragraph.length){

            html +=
                `<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`;

            paragraph = [];
        }
    }


    function inlineMarkdown(value){

        value = escapeHtml(value);

        value = value.replace(
            /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>'
        );

        value = value.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

        value = value.replace(
            /\*\*([^*]+)\*\*/g,
            "<strong>$1</strong>"
        );

        value = value.replace(
            /\*([^*]+)\*/g,
            "<em>$1</em>"
        );

        value = value.replace(
            /~~([^~]+)~~/g,
            "<del>$1</del>"
        );

        return value;
    }


    for(const rawLine of lines){

        /* ---------- CODE BLOCK ---------- */

        if(rawLine.trim() === "```"){

            if(!inCodeBlock){

                flushParagraph();
                closeLists();

                inCodeBlock = true;
                codeBuffer = [];

            }else{

                html +=
                    `<pre><code>${escapeHtml(codeBuffer.join("\n"))}</code></pre>`;

                inCodeBlock = false;
                codeBuffer = [];
            }

            continue;
        }


        if(inCodeBlock){

            codeBuffer.push(rawLine);
            continue;
        }


        const line = rawLine.trim();


        /* ---------- EMPTY LINE ---------- */

        if(!line){

            flushParagraph();
            closeLists();

            continue;
        }


        /* ---------- HORIZONTAL LINE ---------- */

        if(/^(-{3,}|\*{3,})$/.test(line)){

            flushParagraph();
            closeLists();

            html += "<hr>";

            continue;
        }


        /* ---------- HEADINGS ---------- */

        let match =
            line.match(/^(#{1,3})\s+(.+)$/);

        if(match){

            flushParagraph();
            closeLists();

            const level =
                match[1].length;

            html +=
                `<h${level}>${inlineMarkdown(match[2])}</h${level}>`;

            continue;
        }


        /* ---------- UNORDERED LIST ---------- */

        match =
            line.match(/^[-*]\s+(.+)$/);

        if(match){

            flushParagraph();

            if(inOl){

                html += "</ol>";
                inOl = false;
            }

            if(!inUl){

                html += "<ul>";
                inUl = true;
            }

            html +=
                `<li>${inlineMarkdown(match[1])}</li>`;

            continue;
        }


        /* ---------- ORDERED LIST ---------- */

        match =
            line.match(/^(\d+)\.\s+(.+)$/);

        if(match){

            flushParagraph();

            if(inUl){

                html += "</ul>";
                inUl = false;
            }

            if(!inOl){

                html += "<ol>";
                inOl = true;
            }

            const number = parseInt(match[1], 10);
            const content = match[2];

            html +=
                `<li value="${number}">
                    ${inlineMarkdown(content)}
                </li>`;

            continue;
        }


        /* ---------- BLOCKQUOTE ---------- */

        match =
            line.match(/^>\s?(.*)$/);

        if(match){

            flushParagraph();
            closeLists();

            html +=
                `<blockquote>${inlineMarkdown(match[1])}</blockquote>`;

            continue;
        }


        /* ---------- NORMAL TEXT ---------- */

        closeLists();

        paragraph.push(line);
    }


    /* ---------- FINISH ---------- */

    if(inCodeBlock){

        html +=
            `<pre><code>${escapeHtml(codeBuffer.join("\n"))}</code></pre>`;
    }

    flushParagraph();
    closeLists();

    return html;
}


function shortUrl(url, max = 40){

    if(url.length <= max)
        return url;

    return url.slice(0, max) + "...";
}

async function copyText(text, button){

    await navigator.clipboard.writeText(text);

    const old = button.innerHTML;

    button.innerHTML = "✅";

    setTimeout(()=>{
        button.innerHTML = old;
    },1000);
}

function removeSection(id){

    if(!confirm("Delete section?"))
        return;

    const categoryIds =
        state.data.categories
            .filter(
                category =>
                category.sectionId === id
            )
            .map(
                category =>
                category.id
            );

    state.data.categories =
        state.data.categories.filter(
            category =>
            category.sectionId !== id
        );

    state.data.links =
        state.data.links.filter(
            link =>
            !categoryIds.includes(link.categoryId)
        );

    state.data.sections =
        state.data.sections.filter(
            section =>
            section.id !== id
        );
        
    // сброс выбранного раздела
    if(state.ui.selectedId === id &&
       state.ui.selectedType === "section"){

        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    // сброс выбранной категории внутри удалённого раздела
    if(
        state.ui.selectedCategoryId &&
        categoryIds.includes(state.ui.selectedCategoryId)
    ){

        state.ui.selectedCategoryId = null;
        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    // закрыть форму добавления ссылки
    if(
        state.ui.activeCategoryId &&
        categoryIds.includes(state.ui.activeCategoryId)
    ){

        state.ui.activeCategoryId = null;
    }
    
    markChanged()

    render();
}


function removeCategory(id) {

    if(!confirm("Delete category?"))
        return;

    state.data.categories =
        state.data.categories.filter(
            item => item.id !== id
        );

    state.data.links =
        state.data.links.filter(
            item => item.categoryId !== id
        );
        
    if(state.ui.selectedCategoryId === id){
        state.ui.selectedCategoryId = null;
        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    if(state.ui.activeCategoryId === id){
        state.ui.activeCategoryId = null;
    }
    
    markChanged()

    render();
}


function getTrashCategory(){

    let trashSection =
        state.data.sections.find(
            item => item.system === "trash"
        );

    if(!trashSection){

        trashSection = {
            id: Date.now(),
            name:"🗑️ Trash",
            system:"trash"
        };

        state.data.sections.push(trashSection);
    }

    let trashCategory =
        state.data.categories.find(
            item => item.system === "trash"
        );

    if(!trashCategory){

        trashCategory = {
            id: Date.now(),
            name:"Deleted links",
            sectionId:trashSection.id,
            system:"trash"
        };

        state.data.categories.push(trashCategory);
    }

    return trashCategory.id;
}

function handleKeydown(e){

    if(e.key === "Escape"){

        if(state.ui.editId){
            cancelEdit();
            return;
        }

        if(state.ui.form){
            state.ui.form = null;
            render();
            return;
        }

        if(state.ui.editTitle){
            state.ui.editTitle = false;
            render();
            return;
        }
    }

    if(e.key === "Enter"){

        // чтобы Enter не срабатывал внутри textarea
        if(e.target.tagName === "TEXTAREA"){
            return;
        }

        const form =
            e.target.closest(".link, .form, .title-edit");

        if(!form){
            return;
        }

        let button =
            form.querySelector(
                '[data-action^="save"]'
            );

        // открытие зашифрованной базы
        if(!button){

            button =
                form.querySelector(
                    '[data-action="unlock"]'
                );
        }

        if(button){
            button.click();
        }
    }
}


function saveForm(button){
    
    const form = button.closest(".link");
        
    const data = state.ui.form;
    
    if(data.type === "move-category"){

        const select =
            button.closest(".form")
                .querySelector(".move-select");

        const category =
            state.data.categories.find(
                item => item.id === data.id
            );

        if(category){

            category.sectionId =
                Number(select.value);
        }

        state.ui.form = null;
        
        markChanged();
        
        render();
        
        return;
    }

    const value =
        form.querySelector(".form-input").value.trim();

    if(!value)
        return;

    // добавление раздела
    if(
        data.type === "section" &&
        data.mode === "add"
    ){

        state.data.sections.push({
            id:Date.now(),
            name:value
        });
    }

    // изменение раздела
    if(
        data.type === "section" &&
        data.mode === "edit"
    ){

        const section =
            state.data.sections.find(
                item=>item.id===data.id
            );

        section.name=value;
    }

    // добавление категории
    if(
        data.type==="category" &&
        data.mode==="add"
    ){

        state.data.categories.push({
            id:Date.now(),
            name:value,
            sectionId:data.sectionId
        });
    }

    // изменение категории
    if(
        data.type==="category" &&
        data.mode==="edit"
    ){

        const category =
            state.data.categories.find(
                item=>item.id===data.id
            );

        category.name=value;
    }

    state.ui.form=null;
    
    markChanged()

    render();
}


function scrollTopPage(){

    const content =
        document.getElementById("content");

    if(
        window.matchMedia("(max-width:700px)").matches
    ){

        window.scrollTo({
            top:0,
        });

    } else {

        content.scrollTo({
            top:0,
        });

    }
}


function scrollBottomPage(){

    const content =
        document.getElementById("content");

    if(
        window.matchMedia("(max-width:700px)").matches
    ){

        window.scrollTo({
            top:document.documentElement.scrollHeight,
        });

    } else {

        content.scrollTo({
            top:content.scrollHeight,
        });

    }
}


let noteMouseDownX = 0;
let noteMouseDownY = 0;

function handleNoteMouseDown(e) {

    const note = e.target.closest(".link-note");

    if(!note)
        return;

    noteMouseDownX = e.clientX;
    noteMouseDownY = e.clientY;
}


function handleNoteClick(e) {

    const note = e.target.closest(".link-note");

    if(!note)
        return;
        
    const dx = Math.abs(e.clientX - noteMouseDownX);
    const dy = Math.abs(e.clientY - noteMouseDownY);

    // Если мышь двигалась — это выделение текста, а не клик
    if(dx > 5 || dy > 5)
        return;
        
    const selection = window.getSelection();

    if(selection && selection.toString().length > 0)
        return;

    note.classList.toggle("expanded");
}


function hideScrollButtons(){
    const buttons =
        document.querySelector(".scroll-buttons");

    if(buttons)
        buttons.classList.add("hidden");
}


function showScrollButtons(){
    const buttons =
        document.querySelector(".scroll-buttons");

    if(buttons)
        buttons.classList.remove("hidden");
}


function handleClick(e) {
    
    handleNoteMouseDown(e)
    handleNoteClick(e)

    const button = e.target.closest("button");

    if(!button)
        return;
        
    if(button.dataset.contents){

        state.ui.selectedType = "contents";
        state.ui.selectedId = null;
        state.ui.selectedCategoryId = null;

        render();
        return;
    }
    
    if (button.dataset.section) {
        state.ui.selectedType = "section";
        state.ui.selectedId = Number(button.dataset.section);
        state.ui.selectedCategoryId = null;
        render();
        return;
    }

    if (button.dataset.category) {
        state.ui.selectedType = "category";
        state.ui.selectedId = Number(button.dataset.category);
        state.ui.selectedCategoryId = Number(button.dataset.category);
        render();
        return;
    }
    
    const action = button.dataset.action;
    
    if(action === "scroll-top"){
        scrollTopPage();
        return;
    }

    if(action === "scroll-bottom"){
        scrollBottomPage();
        return;
    }

    if(action === "theme"){
        toggleTheme();
        return;
    }

    const id = button.dataset.id
        ? Number(button.dataset.id)
        : null;
        
    if(action === "copy-login"){
        copyLogin(id, button);
        return;
    }

    if(action === "copy-password"){
        copyPassword(id, button);
        return;
    }

    if(action === "edit") {
        hideScrollButtons();
        editLink(id);
        return;
    }

    if(action === "remove") {
        removeLink(id);
        return;
    }

    if(action === "save-edit") {
        saveEdit(
            id,
            button
        );
        showScrollButtons();
        return;
    }

    if(action === "cancel-edit") {
        cancelEdit();
        return;
    }
    
    if(action === "add-link") {
        showAddForm(id);
        return;
    }
    
    if(action === "add-category") {
        addCategory(id);
        return;
    }

    if(action === "edit-category") {
        editCategory(id);
        return;
    }
    
    if(action === "move-category") {
        moveCategory(id);
        return;
    }

    if(action === "remove-category") {
        removeCategory(id);
        return;
    }
    
    if(action === "save-html") {
        saveHTML();
        return;
    }
    
    if(action === "save-temp") {
        saveTempData();
        return;
    }
    
    if(action === "save-link") {
        saveCategoryLink(
            id,
            button
        );
        showScrollButtons();
        return;
    }
    
    if(action === "save-form") {
        saveForm(button);
        return;
    }
    
    if(action === "save-json") {
        saveJSON();
        return;
    }
    
    if(action === "add-section") {
        addSection();
        return;
    }
    
    if(action === "edit-section") {
        editSection(id);
        return;
    }

    if(action === "remove-section") {
        removeSection(id);
        return;
    }
    
    if (action === "clear-all") {
        clearAll();
        return;
    }
    
    if (action === "load-json") {
        document.getElementById("json-file").click();
        return;
    }
    
    if(action === "cancel-form"){
        state.ui.form = null;
        render();
        return;
    }
    
    if(action === "restore") {
        restoreLink(id);
        return;
    }
    
    if(action === "unlock") {
        unlockDatabase(button);
        return;
    }
    
    if(action === "save-password-confirm"){
        saveHTMLWithPassword(button);
        return;
    }
}


async function unlockDatabase(button){

    const input =
        button
            .closest(".form")
            .querySelector(".password-input");

    const password =
        input.value;

    try {

        const db =
            await decryptData(
                state.ui.passwordTarget,
                password
            );

        state.data.sections =
            db.sections;

        state.data.categories =
            db.categories;

        state.data.links =
            db.links;

        /*
         * Пароль хранится только в памяти
         * текущей страницы.
         */
        state.ui.sessionPassword =
            password;

        state.ui.form = null;
        state.ui.passwordTarget = null;

        await restoreTempData();

        render();
    }

    catch(e){

        input.value = "";
        input.focus();
    }
}


function clearAll() {

    if (!confirm("Are you ready to clear all?"))
        return;

    state.data.sections = [];
    state.data.categories = [];
    state.data.links = [];

    state.ui.selectedType = null;
    state.ui.selectedId = null;
    state.ui.selectedCategoryId = null;
    state.ui.activeCategoryId = null;
    state.ui.editId = null;

    render();
}


function downloadFile(filename, content, type) {
    
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}


// ==========================
// CRYPTO
// ==========================

async function deriveKey(password, salt){

    const enc = new TextEncoder();

    const keyMaterial =
        await crypto.subtle.importKey(
            "raw",
            enc.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );


    return await crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:150000,
            hash:"SHA-256"
        },
        keyMaterial,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        [
            "encrypt",
            "decrypt"
        ]
    );
}


function bytesToBase64(bytes) {
    let binary = "";
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(
            i,
            Math.min(i + chunkSize, bytes.length)
        );

        binary += String.fromCharCode(...chunk);
    }

    return btoa(binary);
}


async function encryptData(data, password){

    const enc =
        new TextEncoder();

    const salt =
        crypto.getRandomValues(
            new Uint8Array(16)
        );

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const encrypted =
        await crypto.subtle.encrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            key,
            enc.encode(
                JSON.stringify(data)
            )
        );

    return {
        encrypted: true,
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(new Uint8Array(encrypted))
    };
}


async function decryptData(obj,password){

    const dec =
        new TextDecoder();

    const salt =
        Uint8Array.from(
            atob(obj.salt),
            c=>c.charCodeAt(0)
        );

    const iv =
        Uint8Array.from(
            atob(obj.iv),
            c=>c.charCodeAt(0)
        );

    const encrypted =
        Uint8Array.from(
            atob(obj.data),
            c=>c.charCodeAt(0)
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const result =
        await crypto.subtle.decrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            key,
            encrypted
        );

    return JSON.parse(
        dec.decode(result)
    );
}


function getSaveDate(){

    const now = new Date();

    return (
        `${now.getUTCFullYear()}_` +
        `${String(now.getUTCMonth() + 1).padStart(2, '0')}` +
        `${String(now.getUTCDate()).padStart(2, '0')}_` +
        `${String(now.getUTCHours()).padStart(2, '0')}` +
        `${String(now.getUTCMinutes()).padStart(2, '0')}`
    );
}


function saveJSON(){
    
    const date = getSaveDate();

    const json =
        JSON.stringify(
            state.data,
            null,
            4
        );

    const title =
        document
            .getElementById("title")
            .textContent
            .trim();

    const safeTitle =
        title.replace(
            /[^\p{L}\p{N}]+/gu,
            "_"
        );

    const name =
        `${safeTitle}_${date}.json`;

    downloadFile(
        name,
        json,
        "application/json;charset=utf-8"
    );
}


async function saveHTML(){

    state.ui.form = {
        type:"save-password",
        title: document
            .getElementById("title")
            .textContent
            .trim()
    };
    
    render();
}


async function saveHTMLWithPassword(button){

    const form =
        button.closest(".form");

    const saveTitle =
        form
            .querySelector(".save-title-input")
            .value
            .trim();
    
    document
        .getElementById("title")
        .textContent = saveTitle;

    const password =
        form
            .querySelector(".save-password-input")
            .value;
    
    let dataToSave;

    if (password) {
        dataToSave = await encryptData(
            state.data,
            password
        );

    } else {

        dataToSave = state.data;
    }
    
    /*
     * Запоминаем режим текущей базы.
     *
     * Пароль хранится только в памяти.
     */
    state.ui.sessionPassword =
        password || null;

    const oldActive = state.ui.activeCategoryId;
    const oldEdit = state.ui.editId;

    state.ui.form = null;
    state.ui.activeCategoryId = null;
    state.ui.editId = null;
    
    markSaved()
    clearTempData();
    render();

    const json =
        JSON.stringify(
            dataToSave,
            null,
            4
        );

    const clone =
        document.documentElement.cloneNode(true);
    
    clone
        .querySelector("body")
        .setAttribute(
            "data-theme",
            document.body.dataset.theme || "silver"
        );
    
    clone
        .querySelector("title")
        .textContent =
        saveTitle;
    
    clone
        .querySelector("#toc")
        .innerHTML = "";

    clone
        .querySelector("#content")
        .innerHTML = "";

    const database =
        clone.querySelector("#database");

    if(database){
        database.textContent = json;
    }

    let html =
        "<!DOCTYPE html>\n" +
        clone.outerHTML;

    const date = getSaveDate();

    const safeTitle =
        saveTitle.replace(
            /[^\p{L}\p{N}]+/gu,"_"
        );

    const name =
        `${safeTitle}_${date}.html`;

    downloadFile(
        name,
        html,
        "text/html;charset=utf-8"
    );

    // вернуть интерфейс
    state.ui.activeCategoryId = oldActive;
    state.ui.editId = oldEdit;
    state.ui.form = null;

    render();
}
