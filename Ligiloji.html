<style>

/* =========================================================
   Ligiloji — SOFT SILVER / GRAPHITE THEME
   ========================================================= */

[data-action="theme"] {
    min-width:100px;
    font-weight:bold;
}

/* ---------- BODY ---------- */

body {
    font-family: Lato, system-ui, sans-serif;

    background:#C9CDD1;
    color:#292D31;

    margin:0;
    height:100vh;

    display:flex;
    flex-direction:column;

    padding:7px;
    box-sizing:border-box;
}

button,
input,
textarea,
select {
    font-family: inherit;
}


/* ---------- TITLE ---------- */

#title {
    color:#3E4348;
}

#title.unsaved {
    color:#FF0000;
}


/* ---------- MAIN ---------- */

.main {
    flex:1;
    display:flex;
    overflow:hidden;
}


/* ---------- CATALOG ---------- */

#toc {
    width:250px;
    overflow-y:auto;

    padding:7px;

    background:#E1E4E7;

    border:1px solid #AEB4BA;
    border-radius:7px;

    box-shadow:
        inset -1px 0 0 rgba(255,255,255,.45),
        0 1px 3px rgba(35,40,45,.10);
}


/* ---------- CONTENT ---------- */

#content {
    flex:1;
    overflow-y:auto;

    margin-left:8px;
    padding:7px;

    background:#BFC4C9;

    border:1px solid #AEB4BA;
    border-radius:7px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20);
}


/* ---------- HEADINGS ---------- */

h1 {
    color:#3E4348;

    font-size:22px;

    margin:0 0 6px;
    padding:5px 0;
}


/* ---------- CONTROLS ---------- */

.controls {
    flex:0 0 auto;

    padding:7px;

    background:#D9DDE1;

    border:1px solid #AEB4BA;
    border-radius:7px;

    box-shadow:
        0 2px 5px rgba(35,40,45,.11);
}


/* ---------- INPUTS / TEXTAREA / SELECT ---------- */

input,
textarea,
select {
    padding:8px;
    margin:5px;

    box-sizing:border-box;

    color:#292D31;
    background:#F5F6F7;

    border:1px solid #AEB4BA;
    border-radius:6px;

    outline:none;
}

input::placeholder,
textarea::placeholder {
    color:#7C838A;
}

input:focus,
textarea:focus,
select:focus {
    border-color:#7D8994;

    box-shadow:
        0 0 0 2px rgba(100,115,130,.18);
}

textarea {
    min-height:60px;
    resize:vertical;
}

select {
    vertical-align:top;
    margin-top:5px;
}


/* ---------- BUTTONS ---------- */

button {
    padding:8px 15px;

    cursor:pointer;
    vertical-align:top;

    margin-top:5px;

    color:#34393E;
    background:#D0D5D9;

    border:1px solid #A7AEB4;
    border-radius:6px;

    box-shadow:
        0 1px 2px rgba(35,40,45,.08);

    transition:
        background .15s ease,
        border-color .15s ease,
        box-shadow .15s ease,
        transform .05s ease;
}

button:hover {
    background:#C5CBD0;

    border-color:#929AA1;

    box-shadow:
        0 2px 4px rgba(35,40,45,.14);
}

button:active {
    transform:translateY(1px);

    background:#B9C0C6;

    box-shadow:
        inset 0 1px 2px rgba(35,40,45,.12);
}


/* ---------- CATEGORY ---------- */

.category {
    margin-top:7px;
}


/* ---------- H2 ---------- */

.category h2 {
    background:#555B61;
    color:#F7F8F9;

    padding:7px;

    border-radius:8px;

    box-shadow:
        0 2px 4px rgba(35,40,45,.18);
}


/* ---------- H3 ---------- */

.category h3 {

    color:#F3F4F5;

    border-radius:8px;

    box-shadow:
        0 1px 3px rgba(35,40,45,.14);
}


/* ---------- LINK CARD ---------- */

.link {
    background:#EEF0F2;

    margin:8px 0;
    padding:7px;

    border-radius:8px;

    border:1px solid #CDD2D6;

    box-shadow:
        0 2px 5px rgba(35,40,45,.13);

    transition:
        background .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
}

.link:hover {
    background:#F2F4F5;

    border-color:#BEC4C9;

    box-shadow:

}


/* ---------- LINKS ---------- */

.link a {

}

.link a:hover {

    text-decoration:underline;
}


/* ---------- LINK HEADER ---------- */

.link-header {

}

.actions {
    display:flex;

}


/* ---------- SECONDARY TEXT ---------- */

.small {

    font-size:15px;
}

.note {
    white-space: pre-wrap;

}

.number {
    font-weight:bold;

    min-width:24px;
}


/* ---------- TABLE OF CONTENTS ---------- */

.toc-item {
    display:block;
    width:100%;
    font-size:16px;

    padding:7px;
    margin-bottom:4px;

    background:transparent;

    border-radius:6px;

}

.toc-item:hover {

}

.toc-item.active {

    box-shadow:

}


/* ---------- SECTION TITLE ---------- */

    font-weight:bold;

    border-bottom:1px solid #AEB4BA;

/* ---------- ROW ---------- */

}


.footer {

}

/* ---------- SCROLL BUTTONS ---------- */

.scroll-buttons {
    position:fixed;
    right:140px;
    bottom:40px;

    display:flex;
    flex-direction:column;
    gap:5px;

}

.scroll-buttons button {
    width:42px;

    padding:0;
    margin:0;

    font-size:20px;
    font-weight:bold;

    border-radius:8px;
    opacity:.70;
}

.scroll-buttons button:hover {
    opacity:1;
}


/* ---------- MOBILE ---------- */

@media (max-width:700px) {
    
    .scroll-buttons {

        transform: translateX(-50%);

    .scroll-buttons button {

    }

    .main {

        width:auto;

    #content {

    }

    .category h2,
    .category h3 {

    }

    .link-header {
        flex-direction:row;

    }

        flex:0 0 auto;

    }

    .link a {
        font-size:16px;

    }

        min-width:0;

}

<body>


<h1 id="title"></h1>


<div class="controls">

    <button data-action="save-html">
        💾 Save HTML
    </button>
    
    <button data-action="save-json">
        ⬆️ Export JSON
    </button>

    <input id="search" placeholder="Search...">

<br>

    </button>

        🧹 Clear all
    </button>
    
    <button data-action="theme" title="Switch theme">
        Silver
    </button>


</div>



<div class="main">

    <div id="toc"></div>

    <div id="content"></div>

</div>


<div class="scroll-buttons">

    <button
        data-action="scroll-top"
        title="Go to top">
        ▲
    </button>

    <button
        data-action="scroll-bottom"
        title="Go to bottom">
        ▼
    </button>

</div>


<script id="database" type="application/json">{
    "sections": [],
    "categories": [],
    "links": []
}
</script>


<footer class="footer">
    Ligiloji © 2026 Eugene Chernereus
</footer>


<script>

const state = {
    data: {
        sections: [],
        categories: [],
        links: []
    },

    ui: {
        search: "",
        editId: null,
        activeCategoryId: null,
        selectedCategoryId: null,
        selectedType: null,
        selectedId: null,
        form: null,
        passwordTarget:null,
        sessionPassword: null
    }
};


/* =========================================================
   THEME SWITCHER
   ========================================================= */

function applyTheme(theme) {

    document.body.dataset.theme = theme;

    const button =
        document.querySelector(
            '[data-action="theme"]'
        );

    if(button){
        button.textContent =
            theme === "warm"
                ? "Gold"
                : "Silver";
    }
}


function toggleTheme(){

    const current =
        document.body.dataset.theme || "silver";

    const next =
        current === "silver"
            ? "warm"
            : "silver";

    applyTheme(next);
}


const fileTheme =
    document.body.dataset.theme || "silver";

applyTheme(fileTheme);


const sortByName = (a, b) => {

    if(a.system === "trash")
        return 1;
    if(b.system === "trash")
        return -1;
        
    return a.name.localeCompare(b.name);
};


const sortByTitle = (a, b) => a.title.localeCompare(b.title);


document.getElementById("title").textContent = document.title;


function updateTitle(){

    const title =
        document.getElementById("title");

    title.classList.toggle(
        "unsaved",
        state.ui.dirty
    );
}


function markChanged(){
    state.ui.dirty = true;
    updateTitle();
    saveTempData();
}

function markSaved(){
    state.ui.dirty = false;
    updateTitle();
}


/* =========================================================
   TEMPORARY BACKUP
   ========================================================= */

const TEMP_SAVE_KEY =
    "ligiloji_temp_v1_" +
    encodeURIComponent(location.pathname);

let tempSaveTimer = null;
let tempSaveVersion = 0;


function saveTempData(){

    clearTimeout(tempSaveTimer);

    tempSaveTimer = setTimeout(async () => {

        const version = ++tempSaveVersion;

        try {

            let tempData;

            /*
             * Если база открыта паролем,
             * временная копия тоже шифруется.
             */
            if(state.ui.sessionPassword){

                tempData =
                    await encryptData(
                        state.data,
                        state.ui.sessionPassword
                    );

            } else {

                tempData = state.data;
            }

            /*
             * Если за время шифрования появились
             * новые изменения — эту копию не сохраняем.
             */
            if(version !== tempSaveVersion)
                return;

            localStorage.setItem(
                TEMP_SAVE_KEY,
                JSON.stringify({
                    version: 1,
                    timestamp: Date.now(),
                    encrypted: !!state.ui.sessionPassword,
                    data: tempData
                })
            );
        }
        
        catch(e){

            console.warn(
                "Ligiloji temporary save failed:",
                e
            );
        }

    }, 500);
}


function getTempData(){

    try {

        const raw =
            localStorage.getItem(
                TEMP_SAVE_KEY
            );

        if(!raw)
            return null;

        const temp =
            JSON.parse(raw);

        if(
            !temp ||
            temp.version !== 1 ||
            !temp.data
        ){
            return null;
        }

        return temp;
    }
    
    catch(e){

        console.warn(
            "Ligiloji temporary backup is damaged:",
            e
        );

        localStorage.removeItem(
            TEMP_SAVE_KEY
        );

        return null;
    }
}


function clearTempData(){

    clearTimeout(tempSaveTimer);

    tempSaveVersion++;

    localStorage.removeItem(
        TEMP_SAVE_KEY
    );
}


async function restoreTempData(){

    const temp =
        getTempData();

    if(!temp)
        return false;

    let restoredData;

    try {

        if(temp.encrypted){

            if(!state.ui.sessionPassword)
                return false;

            restoredData =
                await decryptData(
                    temp.data,
                    state.ui.sessionPassword
                );

        } else {

            restoredData =
                temp.data;
        }

        if(
            !Array.isArray(restoredData.sections) ||
            !Array.isArray(restoredData.categories) ||
            !Array.isArray(restoredData.links)
        ){
            throw new Error(
                "Invalid temporary database"
            );
        }
    }
    
    catch(e){

        console.warn(
            "Ligiloji temporary backup cannot be restored:",
            e
        );

        return false;
    }

    const date =
        new Date(
            temp.timestamp
        ).toLocaleString();

    const restore =
        confirm(
            "Found temporary unsaved changes.\n\n" +
            "Saved: " + date +
            "\n\n" +
            "Restore them?"
        );

    if(!restore){

        clearTempData();

        return false;
    }

    state.data.sections =
        restoredData.sections;

    state.data.categories =
        restoredData.categories;

    state.data.links =
        restoredData.links;

    state.ui.dirty = true;

    if(state.data.categories.length){

        state.ui.selectedCategoryId =
            state.data.categories[0].id;
    }

    updateTitle();

    return true;
}


// загрузка данных
async function loadDatabase() {

    let db = JSON.parse(
        document
            .getElementById("database")
            .textContent
    );

    if(db.encrypted){

        state.ui.passwordTarget = db;

        state.ui.form = {
            type:"password"
        };

        return;
    }

    if(
        !Array.isArray(db.sections) ||
        !Array.isArray(db.categories) ||
        !Array.isArray(db.links)
    ){
        alert("Difektita bazo");
        return;
    }

    state.data.sections = db.sections;
    state.data.categories = db.categories;
    state.data.links = db.links;

    if(state.data.categories.length){

        state.ui.selectedCategoryId =
            state.data.categories[0].id;
    }

    await restoreTempData();
}


document
    .getElementById("json-file")
    .addEventListener("change", importJSON);


function openForm(options) {
    state.ui.form = options;
    render();
}


function focusFirstInput(){

    const input =
        document.querySelector(
            ".form input, .link input, .title-edit input"
        );

    if(input){
        input.focus();
    }
}


function renderForm(form){
    
    if(form.type === "password"){

        return `

        <div class="link form">

            <h3>
                🔒 Enter the password
            </h3>

            <input
                type="password"
                class="password-input"
                placeholder="Pass">

            <button
                data-action="unlock">
                🔓 Open
            </button>

        </div>

        `;
    }
    
    if(form.type === "save-password"){

        return `

        <div class="link form">

            <h3>
                🔐 Enter the password, if you need
            </h3>

            <input
                type="text"
                class="save-password-input"
                placeholder="Pass">
                
            <input
                class="save-title-input"
                value="${state.ui.form.title}"
                placeholder="Title">

            <button
                data-action="save-password-confirm">
                💾 Save
            </button>

            <button
                data-action="cancel-form">
                ❌
            </button>

        </div>

        `;
    }

    if(form.type === "move-category"){

        const options =
            state.data.sections
                .filter(
                    section =>
                    section.system !== "trash"
                )
                .map(section =>
                    `
                    <option
                        value="${section.id}"
                        ${section.id === form.value ? "selected" : ""}>
                        ${section.name}
                    </option>
                    `
                )
                .join("");

        return `
        <div class="link form">

            <select class="move-select">
                ${options}
            </select>

            <button
                data-action="save-form">
                💾
            </button>

            <button
                data-action="cancel-form">
                ❌
            </button>

        </div>
        `;
    }

    return `
    <div class="link form">

        <input
            class="form-input"
            value="${form.value ?? ""}">

        <button
            data-action="save-form">
            💾
        </button>

        <button
            data-action="cancel-form">
            ❌
        </button>

    </div>
    `;
}


function importJSON(e) {

    const file = e.target.files[0];

    if (!file)
        return;
        
    if (!confirm("Replace ALL date?")) {
        e.target.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {

        try {

            const data = JSON.parse(reader.result);
            
            if (
                !Array.isArray(data.sections) ||
                !Array.isArray(data.categories) ||
                !Array.isArray(data.links)
            ) {
                throw new Error();
            }

            state.data.sections = data.sections;
            state.data.categories = data.categories;
            state.data.links = data.links;
            
            markChanged();

            state.ui.selectedType = null;
            state.ui.selectedId = null;
            state.ui.selectedCategoryId = null;
            state.ui.activeCategoryId = null;
            state.ui.editId = null;

            render();

        } catch {

            alert("Wrong JSON");
        }
        
        e.target.value = "";
    };

    reader.readAsText(file);
}


// поиск и фильтрация
function getFilteredLinks() {

    const query =
        state.ui.search.toLowerCase().trim();

    return state.data.links.filter(item => {

        const text = [
            item.title,
            item.login
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(query);
    });
}


// главный вывод
function render() {

    const container =
        document.getElementById("content");
    
    container.innerHTML = "";
    
    if(state.ui.form){
        container.innerHTML +=
            renderForm(state.ui.form);
    }

    const filtered =
        getFilteredLinks();
        
    if(
        state.ui.selectedType === "section"
    ){

        const section =
            state.data.sections.find(
                item =>
                item.id === state.ui.selectedId
            );

        if(section){

            container.appendChild(
                renderSection(section, filtered)
            );
        }
    }

    else if(
        state.ui.selectedType === "contents"
    ){

        const items =
            filtered
                .sort(sortByTitle);

        const block =
            document.createElement("div");

        block.className = "category";

        let html = `
            <h2>
                📖 Catalog
            </h2>
        `;

        items.forEach((item, index) => {

            html += renderLink(
                item,
                index + 1
            );

        });

        block.innerHTML = html;

        container.appendChild(block);
    }

    else if(
        state.ui.selectedType === "category"
    ){

        const category =
            state.data.categories.find(
                item =>
                item.id === state.ui.selectedId
            );

        if(category){

            const items =
                filtered
                    .filter(
                        item =>
                            item.categoryId === category.id
                    )
                    .sort(sortByTitle);

            container.appendChild(
                renderCategory(
                    category,
                    items
                )
            );
        }
    }

    renderContents();
    
    requestAnimationFrame(()=>{
        focusFirstInput();
    });
}


function renderSection(section, filtered){

    const block =
        document.createElement("div");

    block.className =
        "category";

    let html = "";

    html += `

    <h2>

        💼 ${section.name}

        <button
            data-action="add-category"
            data-id="${section.id}">
            ➕📂
        </button>

        <button
            data-action="edit-section"
            data-id="${section.id}">
            ✏️
        </button>

        <button
            data-action="remove-section"
            data-id="${section.id}">
            🗑️
        </button>

    </h2>

    `;

    const categories =
        state.data.categories
            .filter(
                category =>
                    category.sectionId === section.id
            )
            .sort(sortByName);

    categories.forEach(category => {

        html += renderCategoryHeader(category);
        
        if (state.ui.activeCategoryId === category.id) {
            html += renderAddForm(category);
        }

        const items =
            filtered
                .filter(
                    item => item.categoryId === category.id
                )
                .sort(sortByTitle);

        items.forEach((item, index) => {
            html += renderLink(item, index + 1);
        });

    });

    block.innerHTML = html;

    return block;
}


// одна категория
function renderCategory(category, items) {

    const block =
        document.createElement("div");

    block.className = "category";

    let html = "";

    html +=
        renderCategoryHeader(category);

    if (state.ui.activeCategoryId === category.id) {

        html +=
            renderAddForm(category);
    }

    items.forEach((item, index) => {
        html += renderLink(item, index + 1);
    });

    block.innerHTML = html;

    return block;
}


function isTrashLink(item){

    const trash =
        state.data.categories.find(
            category => category.system === "trash"
        );

    return Boolean(
        trash &&
        item.categoryId === trash.id
    );
}


function shortUrl(url, max = 40){

    if(url.length <= max)
        return url;

    return url.slice(0, max) + "...";
}

async function copyText(text, button){

    await navigator.clipboard.writeText(text);

    const old = button.innerHTML;

    button.innerHTML = "✅";

    setTimeout(()=>{
        button.innerHTML = old;
    },1000);
}

function removeSection(id){

    if(!confirm("Delete section?"))
        return;

    const categoryIds =
        state.data.categories
            .filter(
                category =>
                category.sectionId === id
            )
            .map(
                category =>
                category.id
            );

    state.data.categories =
        state.data.categories.filter(
            category =>
            category.sectionId !== id
        );

    state.data.links =
        state.data.links.filter(
            link =>
            !categoryIds.includes(link.categoryId)
        );

    state.data.sections =
        state.data.sections.filter(
            section =>
            section.id !== id
        );
        
    // сброс выбранного раздела
    if(state.ui.selectedId === id &&
       state.ui.selectedType === "section"){

        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    // сброс выбранной категории внутри удалённого раздела
    if(
        state.ui.selectedCategoryId &&
        categoryIds.includes(state.ui.selectedCategoryId)
    ){

        state.ui.selectedCategoryId = null;
        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    // закрыть форму добавления ссылки
    if(
        state.ui.activeCategoryId &&
        categoryIds.includes(state.ui.activeCategoryId)
    ){

        state.ui.activeCategoryId = null;
    }
    
    markChanged()

    render();
}


function removeCategory(id) {

    if(!confirm("Delete category?"))
        return;

    state.data.categories =
        state.data.categories.filter(
            item => item.id !== id
        );

    state.data.links =
        state.data.links.filter(
            item => item.categoryId !== id
        );
        
    if(state.ui.selectedCategoryId === id){
        state.ui.selectedCategoryId = null;
        state.ui.selectedType = null;
        state.ui.selectedId = null;
    }
    
    if(state.ui.activeCategoryId === id){
        state.ui.activeCategoryId = null;
    }
    
    markChanged()

    render();
}


function getTrashCategory(){

    let trashSection =
        state.data.sections.find(
            item => item.system === "trash"
        );

    if(!trashSection){

        trashSection = {
            id: Date.now(),
            name:"🗑️ Trash",
            system:"trash"
        };

        state.data.sections.push(trashSection);
    }

    let trashCategory =
        state.data.categories.find(
            item => item.system === "trash"
        );

    if(!trashCategory){

        trashCategory = {
            id: Date.now(),
            name:"Deleted links",
            sectionId:trashSection.id,
            system:"trash"
        };

        state.data.categories.push(trashCategory);
    }

    return trashCategory.id;
}

function handleKeydown(e){

    if(e.key === "Escape"){

        if(state.ui.editId){
            state.ui.editId = null;
            render();
            return;
        }

        if(state.ui.form){
            state.ui.form = null;
            render();
            return;
        }

        if(state.ui.editTitle){
            state.ui.editTitle = false;
            render();
            return;
        }
    }

    if(e.key === "Enter"){

        // чтобы Enter не срабатывал внутри textarea
        if(e.target.tagName === "TEXTAREA"){
            return;
        }

        const form =
            e.target.closest(".link, .form, .title-edit");

        if(!form){
            return;
        }

        let button =
            form.querySelector(
                '[data-action^="save"]'
            );

        // открытие зашифрованной базы
        if(!button){

            button =
                form.querySelector(
                    '[data-action="unlock"]'
                );
        }

        if(button){
            button.click();
        }
    }
}


function saveForm(button){

    const form = button.closest(".link");
        
    const data = state.ui.form;
    
    if(data.type === "move-category"){

        const select =
            button.closest(".form")
                .querySelector(".move-select");

        const category =
            state.data.categories.find(
                item => item.id === data.id
            );

        if(category){

            category.sectionId =
                Number(select.value);
        }

        state.ui.form = null;
        
        markChanged();

        render();

        return;
    }

    const value =
        form.querySelector(".form-input").value.trim();

    if(!value)
        return;

    // добавление раздела
    if(
        data.type === "section" &&
        data.mode === "add"
    ){

        state.data.sections.push({
            id:Date.now(),
            name:value
        });
    }

    // изменение раздела
    if(
        data.type === "section" &&
        data.mode === "edit"
    ){

        const section =
            state.data.sections.find(
                item=>item.id===data.id
            );

        section.name=value;
    }

    // добавление категории
    if(
        data.type==="category" &&
        data.mode==="add"
    ){

        state.data.categories.push({
            id:Date.now(),
            name:value,
            sectionId:data.sectionId
        });
    }

    // изменение категории
    if(
        data.type==="category" &&
        data.mode==="edit"
    ){

        const category =
            state.data.categories.find(
                item=>item.id===data.id
            );

        category.name=value;
    }

    state.ui.form=null;
    
    markChanged()

    render();
}


function scrollTopPage(){

    const content =
        document.getElementById("content");

    if(
        window.matchMedia("(max-width:700px)").matches
    ){

        window.scrollTo({
            top:0,
        });

    } else {

        content.scrollTo({
            top:0,
        });

    }
}


function scrollBottomPage(){

    const content =
        document.getElementById("content");

    if(
        window.matchMedia("(max-width:700px)").matches
    ){

        window.scrollTo({
            top:document.documentElement.scrollHeight,
        });

    } else {

        content.scrollTo({
            top:content.scrollHeight,
        });

    }
}



function handleClick(e) {

    const button = e.target.closest("button");

    if(!button)
        return;
        
    if(button.dataset.contents){

        state.ui.selectedType = "contents";
        state.ui.selectedId = null;
        state.ui.selectedCategoryId = null;

        render();
        return;
    }
    
    if (button.dataset.section) {
        state.ui.selectedType = "section";
        state.ui.selectedId = Number(button.dataset.section);
        state.ui.selectedCategoryId = null;
        render();
        return;
    }

    if (button.dataset.category) {
        state.ui.selectedType = "category";
        state.ui.selectedId = Number(button.dataset.category);
        state.ui.selectedCategoryId = Number(button.dataset.category);
        render();
        return;
    }
    
    const action = button.dataset.action;
    
    if(action === "scroll-top"){
        scrollTopPage();
        return;
    }

    if(action === "scroll-bottom"){
        scrollBottomPage();
        return;
    }


    if(action === "theme"){
        toggleTheme();
        return;
    }

    const id = button.dataset.id
        ? Number(button.dataset.id)
        : null;
        
    if(action === "copy-login"){
        copyLogin(id, button);
        return;
    }

    if(action === "copy-password"){
        copyPassword(id, button);
        return;
    }

    if(action === "edit") {
        editLink(id);
        return;
    }

    if(action === "remove") {
        removeLink(id);
        return;
    }

    if(action === "save-edit") {
        saveEdit(
            id,
            button
        );
        return;
    }

    if(action === "cancel-edit") {
        cancelEdit();
        return;
    }
    
    if(action === "add-link") {
        showAddForm(id);
        return;
    }
    
    if(action === "add-category") {
        addCategory(id);
        return;
    }

    if(action === "edit-category") {
        editCategory(id);
        return;
    }
    
    if(action === "move-category") {
        moveCategory(id);
        return;
    }

    if(action === "remove-category") {
        removeCategory(id);
        return;
    }
    
    if(action === "save-html") {
        saveHTML();
        return;
    }
    
    if(action === "save-link") {
        saveCategoryLink(
            id,
            button
        );
        return;
    }
    
    if(action === "save-form") {
        saveForm(button);
        return;
    }
    
    if(action === "save-json") {
        saveJSON();
        return;
    }
    
    if(action === "add-section") {
        addSection();
        return;
    }
    
    if(action === "edit-section") {
        editSection(id);
        return;
    }

    if(action === "remove-section") {
        removeSection(id);
        return;
    }
    
    if (action === "clear-all") {
        clearAll();
        return;
    }
    
    if (action === "load-json") {
        document.getElementById("json-file").click();
        return;
    }
    
    if(action === "cancel-form"){
        state.ui.form = null;
        render();
        return;
    }
    
    if(action === "restore") {
        restoreLink(id);
        return;
    }
    
    if(action === "unlock") {
        unlockDatabase(button);
        return;
    }
    
    if(action === "save-password-confirm"){
        saveHTMLWithPassword(button);
        return;
    }
}


async function unlockDatabase(button){

    const input =
        button
            .closest(".form")
            .querySelector(".password-input");

    const password =
        input.value;

    try {

        const db =
            await decryptData(
                state.ui.passwordTarget,
                password
            );

        state.data.sections =
            db.sections;

        state.data.categories =
            db.categories;

        state.data.links =
            db.links;

        /*
         * Пароль хранится только в памяти
         * текущей страницы.
         */
        state.ui.sessionPassword =
            password;

        state.ui.form = null;
        state.ui.passwordTarget = null;

        await restoreTempData();

        render();
    }

    catch(e){

        input.value = "";
        input.focus();
    }
}


function clearAll() {

    if (!confirm("Are you ready to clear all?"))
        return;

    state.data.sections = [];
    state.data.categories = [];
    state.data.links = [];

    state.ui.selectedType = null;
    state.ui.selectedId = null;
    state.ui.selectedCategoryId = null;
    state.ui.activeCategoryId = null;
    state.ui.editId = null;

    render();
}


function downloadFile(filename, content, type) {
    
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}


// ==========================
// CRYPTO
// ==========================

async function deriveKey(password, salt){

    const enc = new TextEncoder();

    const keyMaterial =
        await crypto.subtle.importKey(
            "raw",
            enc.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );


    return await crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:150000,
            hash:"SHA-256"
        },
        keyMaterial,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        [
            "encrypt",
            "decrypt"
        ]
    );
}



async function encryptData(data, password){

    const enc =
        new TextEncoder();

    const salt =
        crypto.getRandomValues(
            new Uint8Array(16)
        );

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const encrypted =
        await crypto.subtle.encrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            key,
            enc.encode(
                JSON.stringify(data)
            )
        );


    return {

        encrypted:true,

        salt:
            btoa(
                String.fromCharCode(...salt)
            ),

        iv:
            btoa(
                String.fromCharCode(...iv)
            ),

        data:
            btoa(
                String.fromCharCode(
                    ...new Uint8Array(encrypted)
                )
            )
    };
}


async function decryptData(obj,password){

    const dec =
        new TextDecoder();

    const salt =
        Uint8Array.from(
            atob(obj.salt),
            c=>c.charCodeAt(0)
        );

    const iv =
        Uint8Array.from(
            atob(obj.iv),
            c=>c.charCodeAt(0)
        );

    const encrypted =
        Uint8Array.from(
            atob(obj.data),
            c=>c.charCodeAt(0)
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const result =
        await crypto.subtle.decrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            key,
            encrypted
        );

    return JSON.parse(
        dec.decode(result)
    );
}


function getSaveDate(){

    const now = new Date();

    return (
        `${now.getUTCFullYear()}_` +
        `${String(now.getUTCMonth() + 1).padStart(2, '0')}` +
        `${String(now.getUTCDate()).padStart(2, '0')}_` +
        `${String(now.getUTCHours()).padStart(2, '0')}` +
        `${String(now.getUTCMinutes()).padStart(2, '0')}`
    );
}


function saveJSON(){
    
    const date = getSaveDate();

    const json =
        JSON.stringify(
            state.data,
            null,
            4
        );

    const title =
        document
            .getElementById("title")
            .textContent
            .trim();

    const safeTitle =
        title.replace(
            /[^\p{L}\p{N}]+/gu,
            "_"
        );

    const name =
        `${safeTitle}_${date}.json`;

    downloadFile(
        name,
        json,
        "application/json;charset=utf-8"
    );
}


async function saveHTML(){

    state.ui.form = {
        type:"save-password",
        title: document
            .getElementById("title")
            .textContent
            .trim()
    };
    
    render();
}


async function saveHTMLWithPassword(button){

    const form =
        button.closest(".form");

    const saveTitle =
        form
            .querySelector(".save-title-input")
            .value
            .trim();
    
    document
        .getElementById("title")
        .textContent = saveTitle;

    const password =
        form
            .querySelector(".save-password-input")
            .value;
    
    let dataToSave;

    if (password) {
        dataToSave = await encryptData(
            state.data,
            password
        );

    } else {

        dataToSave = state.data;
    }
    
    /*
     * Запоминаем режим текущей базы.
     *
     * Пароль хранится только в памяти.
     */
    state.ui.sessionPassword =
        password || null;

    const oldActive = state.ui.activeCategoryId;
    const oldEdit = state.ui.editId;

    state.ui.form = null;
    state.ui.activeCategoryId = null;
    state.ui.editId = null;
    
    markSaved()
    clearTempData();
    render();

    const json =
        JSON.stringify(
            dataToSave,
            null,
            4
        );

    const clone =
        document.documentElement.cloneNode(true);
    
    clone
        .querySelector("body")
        .setAttribute(
            "data-theme",
            document.body.dataset.theme || "silver"
        );
    
    clone
        .querySelector("title")
        .textContent =
        saveTitle;
    
    clone
        .querySelector("#toc")
        .innerHTML = "";

    clone
        .querySelector("#content")
        .innerHTML = "";

    const database =
        clone.querySelector("#database");

    if(database){
        database.textContent = json;
    }

    let html =
        "<!DOCTYPE html>\n" +
        clone.outerHTML;

    const date = getSaveDate();

    const safeTitle =
        saveTitle.replace(
            /[^\p{L}\p{N}]+/gu,"_"
        );

    const name =
        `${safeTitle}_${date}.html`;

    downloadFile(
        name,
        html,
        "text/html;charset=utf-8"
    );

    // вернуть интерфейс
    state.ui.activeCategoryId = oldActive;
    state.ui.editId = oldEdit;
    state.ui.form = null;

    render();
}
